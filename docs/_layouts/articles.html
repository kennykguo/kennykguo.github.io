---
layout: compress
---
{% include head.html %}
    <main>
        {% include header.html %}
        <h2>{{ page.title }}</h2>
        {{ page.content }}
        {% for post in site.posts %}
            <article>
                <h3><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h3>
                <!-- <span class="mini-note">{{ post.date | date: "%b %-d, %Y" }}</span> -->
                <span>{{ post.date | date: "%Y/%m/%d" }}</span>

            </article>
        {% endfor %}
    </main>
</body>
</html>
