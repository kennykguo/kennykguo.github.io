---
layout: compress
---
{% include head.html %}
    <main>
        {% include header.html %}
        <article class="post">
            <header class="post-header">
                <h1 class="post-title">{{ page.title }}</h1>
                <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
            </header>
            <nav class="post-toc" aria-label="Contents" hidden></nav>
            <div class="post-body">
                {{ content }}
            </div>
            <p class="post-back"><a href="{{ site.baseurl }}/reasoning/">&larr; Back to reasoning</a></p>
        </article>
    </main>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="{{ site.baseurl }}/scripts/post-math.js?v={{ site.time | date: "%Y%m%d%H%M%S" }}"></script>
<script defer src="{{ site.baseurl }}/scripts/post-toc.js?v={{ site.time | date: "%Y%m%d%H%M%S" }}"></script>
{% for script in page.scripts %}<script defer src="{{ site.baseurl }}{{ page.url }}{{ script }}?v={{ site.time | date: "%Y%m%d%H%M%S" }}"></script>{% endfor %}
{% for script in page.modules %}<script type="module" src="{{ site.baseurl }}{{ page.url }}{{ script }}?v={{ site.time | date: "%Y%m%d%H%M%S" }}"></script>{% endfor %}
</body>
</html>
