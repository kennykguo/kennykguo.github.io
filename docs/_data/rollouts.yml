- title: Open source TPU - performs training/inference of neural networks
  start_date: 2025-05-19
  description: A few friends and I wanted to understand how TPUs work, so we built a small one in SystemVerilog. Worked through matrix multiplication, backpropagation, and the memory layout ourselves, then put together an FPGA demo and wrote a blog post.
