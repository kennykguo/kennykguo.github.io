- title: Neural network on an FPGA
  start_date: 2024-10-01
  description: Had a crazy idea to build a neural network in Verilog, basically writing the circuit for a model that classifies handwritten digits. This was one of my hardest projects. Learned the hard way that simulation != FPGA. Performs inference on MNIST in under 0.53 MB of total FPGA memory.
  images:
    - src: /media/images/veri-nn-digit-8.jpg
      width: 2400
      height: 2066
      priority: 3
      alt: Handwritten digit eight displayed on a monitor beside the DE1-SoC FPGA running the neural network.
    - src: /media/images/veri-nn-rtl.png
      width: 1468
      height: 1007
      priority: 2
      alt: RTL schematic of the Verilog neural network.
    - src: /media/images/modelsim-output.png
      width: 1318
      height: 981
      priority: 1
      alt: ModelSim simulation output for the neural network hardware.
  links:
