- title: Shady - GLSL to SPIR-V compiler
  start_date: 2025-12-04
  description: Spent a lot of time working through the [Dragon Book](https://dpvipracollege.ac.in/wp-content/uploads/2023/01/Alfred-V.-Aho-Monica-S.-Lam-Ravi-Sethi-Jeffrey-D.-Ullman-Compilers-Principles-Techniques-and-Tools-Pearson_Addison-Wesley-2007.pdf) for a class. Ended up building a GLSL compiler that emits SPIR-V, then using a small Vulkan renderer to run the shaders on my GPU.
  images:
    - src: /media/images/shady/teapot-workspace-8x16.webp
      width: 6144
      height: 1712
      full_width: true
      priority: 3
      alt: Eight rows of sixteen teapots on one continuous dark workspace, with 64 simple and medium surface shaders followed by 64 complex shaders, compiled by Shady and rendered with Vulkan.
  links:
    - label: GitHub
      url: https://github.com/kennykguo/shady

