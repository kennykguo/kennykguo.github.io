# Add project entries here. See docs/rollouts/README.md for the fields.
- title: 400 Gb/s optical transmitter - simulation and wavelength control
  start_date: 2026-11-22
  description: Building a physics-based simulator of a 400 Gb/s optical transmitter with eight ring resonators. Using it to develop controllers that maintain wavelength lock despite thermal crosstalk and laser drift.
  images:
    - src: /media/images/optical-transmitter/ring-model.png
      width: 1383
      height: 1035
      alt: Hand-drawn ring resonator model showing two couplers, clockwise and counterclockwise fields, backscattering, and four ports.
    - src: /media/images/optical-transmitter/eight-ring-simulation.png
      width: 1497
      height: 425
      alt: Eight-ring transmitter simulation showing monitor photodiodes, drivers, and a thermal disturbance beside the first ring.
    - src: /media/images/optical-transmitter/eight-ring-cad.png
      width: 3840
      height: 1600
      alt: CAD view of eight ring resonators arranged along a shared optical waveguide.
  links:
    - label: Blog
      url: /reasoning/deep-dive-into-photonics/

